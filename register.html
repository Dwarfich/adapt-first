<doctype html>
<html>
<head><style>
    body {
      color: white;
    }

      * {
    box-sizing: border-box;
  }

    {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #eee;
  }

  .slider {
    position: relative;
    width: 30vw;
    height: 20vh;
    overflow: hidden;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
  }

  .slides {
    display: flex;
    width: 400%;
    height: 100%;
    transition: transform 0.6s ease;
  }

  input[type="radio"] {
    display: none;
  }

  .slide {
    width: 100%;
    flex-shrink: 0;
    background-size: cover;
    background-position: center;
  }

  .s1 { background-image: url('https://picsum.photos/id/1015/800/600'); }
  .s2 { background-image: url('https://picsum.photos/id/1016/800/600'); }
  .s3 { background-image: url('https://picsum.photos/id/1020/800/600'); }
  .s4 { background-image: url('https://picsum.photos/id/1024/800/600'); }

  #r1:checked ~ .slides { transform: translateX(0); }
  #r2:checked ~ .slides { transform: translateX(-100%); }
  #r3:checked ~ .slides { transform: translateX(-200%); }
  #r4:checked ~ .slides { transform: translateX(-300%); }

  .nav {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
  }

  .nav label {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: rgba(255,255,255,0.6);
    cursor: pointer;
    transition: background 0.3s;
  }

  .nav label:hover {
    background: white;
  }

  /* Активная точка */
  #r1:checked ~ .nav label[for="r1"],
  #r2:checked ~ .nav label[for="r2"],
  #r3:checked ~ .nav label[for="r3"],
  #r4:checked ~ .nav label[for="r4"] {
    background: white;
  }

  </style> 

</head>

<body bgcolor="#000000" align="center">
    <h2>Регистрация</h2>

    <form action="/submit" method="post">
        <label for="username">Имя:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="email">Электронная почта:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Пароль:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <label for="confirm_password">Подтвердите пароль:</label><br>
        <input type="password" id="confirm_password" name="confirm_password" required><br><br>

        <input type="submit" value="Зарегистрироваться">
    </form>
    
<h1>Предстоящие новинки</h1>
    <div class="slider">
    <!-- Радиокнопки -->
    <input type="radio" name="r" id="r1" checked>
    <input type="radio" name="r" id="r2">
    <input type="radio" name="r" id="r3">
    <input type="radio" name="r" id="r4">

    <!-- Слайды -->
    <div class="slides">
      <div class="slide s1"></div>
      <div class="slide s2"></div>
      <div class="slide s3"></div>
      <div class="slide s4"></div>
    </div>

    <!-- Навигация -->
    <div class="nav">
      <label for="r1"></label>
      <label for="r2"></label>
      <label for="r3"></label>
      <label for="r4"></label>
    </div>
  </div>

</body>
</html>
