<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Регистрация и Слайдер</title>
<style>
  body {
    background-color: #000;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
  }

  h1, h2 {
    color: #fff;
  }

  form {
    margin: 30px auto;
    width: 300px;
    text-align: left;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 8px;
    margin: 6px 0;
    border-radius: 5px;
    border: none;
  }

  input[type="submit"] {
    width: 100%;
    padding: 10px;
    background-color: #444;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  input[type="submit"]:hover {
    background-color: #666;
  }

  /* Слайдер */
  .slider {
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    margin: 50px auto;
    width: 900px;
    max-width: 95%;
    height: 600px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }

  .slider img {
    width: 100%;
    height: 600px;
    object-fit: cover;
    display: block;
  }

  .js-slider {
    display: flex;
    align-items: center;
    position: relative;
  }

  .js-slider .slides {
    display: flex;
    transition: transform 0.7s ease-in-out;
  }

  .js-slider img {
    width: 100%;
    flex-shrink: 0;
  }

  .js-slider button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.4);
    color: white;
    border: none;
    font-size: 30px;
    cursor: pointer;
    z-index: 10;
    width: 50px;
    height: 80px;
    border-radius: 8px;
  }

  .js-slider button:hover {
    background: rgba(0,0,0,0.6);
  }

  .js-slider .prev { left: 15px; }
  .js-slider .next { right: 15px; }
</style>
</head>

<body>
  <h2>Регистрация</h2>

  <form action="/submit" method="post">
    <label for="username">Имя:</label><br>
    <input type="text" id="username" name="username" required><br><br>

    <label for="email">Электронная почта:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="password">Пароль:</label><br>
    <input type="password" id="password" name="password" required><br><br>

    <label for="confirm_password">Подтвердите пароль:</label><br>
    <input type="password" id="confirm_password" name="confirm_password" required><br><br>

    <input type="submit" value="Зарегистрироваться">
  </form>

  <h1>Предстоящие новинки</h1>

  <div class="slider js-slider">
    <button class="prev">❮</button>
    <div class="slides">
      <img src="img/аватар.jpg" alt="Slide 1">
      <img src="img/достать ножи.jpg" alt="Slide 2">
      <img src="img/мстители.jpg" alt="Slide 3">
    </div>
    <button class="next">❯</button>
  </div>

  <script>
  (function(){
    const slider = document.querySelector('.js-slider');
    const slides = slider.querySelector('.slides');
    const imgs = slider.querySelectorAll('img');
    const total = imgs.length;
    let index = 0;

    function showSlide(i){
      slides.style.transform = `translateX(-${i * 100}%)`;
    }

    slider.querySelector('.next').onclick = () => {
      index = (index + 1) % total;
      showSlide(index);
    };

    slider.querySelector('.prev').onclick = () => {
      index = (index - 1 + total) % total;
      showSlide(index);
    };

    setInterval(() => {
      index = (index + 1) % total;
      showSlide(index);
    }, 4000);
  })();
  </script>
</body>
</html>
