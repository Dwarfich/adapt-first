<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Регистрация и слайдер</title>
<style>
  * {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #000;
  color: white;
  font-family: sans-serif;
}

.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-height: 100vh;
  padding: 40px 20px;
}

form {
  text-align: center;
  margin-bottom: 50px;
}

input[type="text"],
input[type="email"],
input[type="password"] {
  width: 100%;
  max-width: 250px;
  padding: 8px;
  border-radius: 5px;
  border: none;
  margin: 5px 0;
}

input[type="submit"] {
  background: #444;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 5px;
  cursor: pointer;
}

input[type="submit"]:hover {
  background: #666;
}

.slider {
  position: relative;
  width: 80%;
  max-width: 600px;
  aspect-ratio: 2 / 3; 
  overflow: hidden;
  border-radius: 10px;
  box-shadow: 0 0 15px rgba(255,255,255,0.2);
  margin-top: 30px;
}

.slides {
  display: flex;
  width: 400%;
  height: 100%;
  transition: transform 0.6s ease;
}

input[type="radio"] {
  display: none;
}

.slide {
  width: 100%;
  flex-shrink: 0;
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#r1:checked ~ .slides { transform: translateX(0); }
#r2:checked ~ .slides { transform: translateX(-100%); }
#r3:checked ~ .slides { transform: translateX(-200%); }
#r4:checked ~ .slides { transform: translateX(-300%); }

.nav {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
}

.nav label {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: rgba(255,255,255,0.6);
  cursor: pointer;
  transition: background 0.3s;
}

.nav label:hover {
  background: white;
}

/* Активная кнопка */
#r1:checked ~ .nav label[for="r1"],
#r2:checked ~ .nav label[for="r2"],
#r3:checked ~ .nav label[for="r3"],
#r4:checked ~ .nav label[for="r4"] {
  background: white;
}

@media (max-width: 700px) {
  .slider {
    width: 90%;
    aspect-ratio: 2 / 3;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"] {
    max-width: 200px;
  }
}

</style> 
</head>

<body>
  <div class="container">
    <h2>Регистрация</h2>

    <form action="/submit" method="post">
      <label for="username">Имя:</label><br>
      <input type="text" id="username" name="username" required><br><br>

      <label for="email">Электронная почта:</label><br>
      <input type="email" id="email" name="email" required><br><br>

      <label for="password">Пароль:</label><br>
      <input type="password" id="password" name="password" required><br><br>

      <label for="confirm_password">Подтвердите пароль:</label><br>
      <input type="password" id="confirm_password" name="confirm_password" required><br><br>

      <input type="submit" value="Зарегистрироваться">
    </form>

    <h1>Предстоящие новинки</h1>

    <div class="slider">
      <!-- Радиокнопки -->
      <input type="radio" name="r" id="r1" checked>
      <input type="radio" name="r" id="r2">
      <input type="radio" name="r" id="r3">
      <input type="radio" name="r" id="r4">

      <div class="slides">
        <div class="slide"><img src="img/mstiteli.jpg" alt="Мстители"></div>
        <div class="slide"><img src="img/chekpuk.jpg" alt="Чекпук"></div>
        <div class="slide"><img src="img/knivesout.jpg" alt="Ножи"></div>
        <div class="slide"><img src="img/avatar.jpg" alt="Аватар"></div>
      </div>

      <div class="nav">
        <label for="r1"></label>
        <label for="r2"></label>
        <label for="r3"></label>
        <label for="r4"></label>
      </div>
    </div>
  </div>
</body>
</html>
