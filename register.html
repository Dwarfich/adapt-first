<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Слайдер без JavaScript</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: sans-serif;
    background: #111;
  }

  .slider {
    position: relative;
    max-width: 900px;
    margin: 50px auto;
    overflow: hidden;
    border-radius: 10px;
  }

  input[type=radio] {
    display: none;
  }

  .slides {
    display: flex;
    width: 400%;
    transition: transform 0.8s ease-in-out;
  }

  .slides img {
    width: 100%;
    flex: 0 0 100%;
    height: auto;
    object-fit: cover;
  }

  input#r1:checked ~ .slides {
    transform: translateX(0);
  }
  input#r2:checked ~ .slides {
    transform: translateX(-100%);
  }
  input#r3:checked ~ .slides {
    transform: translateX(-200%);
  }
  input#r4:checked ~ .slides {
    transform: translateX(-300%);
  }

  /* Навигация (точки) */
  .navigation {
    text-align: center;
    margin-top: 15px;
  }

  .bar {
    display: inline-block;
    width: 14px;
    height: 14px;
    margin: 0 5px;
    border-radius: 50%;
    background: #bbb;
    cursor: pointer;
    transition: background 0.3s;
  }

  input#r1:checked ~ .navigation label[for=r1],
  input#r2:checked ~ .navigation label[for=r2],
  input#r3:checked ~ .navigation label[for=r3],
  input#r4:checked ~ .navigation label[for=r4] {
    background: white;
  }

  @media (max-width: 600px) {
    .bar {
      width: 10px;
      height: 10px;
    }
  }
</style>
</head>
<body>

<div class="slider">
  <input type="radio" name="r" id="r1" checked>
  <input type="radio" name="r" id="r2">
  <input type="radio" name="r" id="r3">
  <input type="radio" name="r" id="r4">

  <div class="slides">
    <img src="img/аватар.jpg" alt="Фото 1">
    <img src="img/достать ножи.jpg" alt="Фото 2">
    <img src="img/шрек.jpg" alt="Фото 3">
    <img src="img/чекпуk.jpg" alt="Фото 4">
  </div>

  <div class="navigation">
    <label for="r1" class="bar"></label>
    <label for="r2" class="bar"></label>
    <label for="r3" class="bar"></label>
    <label for="r4" class="bar"></label>
  </div>
</div>

</body>
</html>
