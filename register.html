<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Слайдер новинок</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background-color: #000;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
  }

  .slider {
    width: 100%;
    max-width: 600px;
    height: 900px;
    border-radius: 15px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    background-color: #000;
  }

  .slides {
    display: flex;
    width: 400%;
    height: 100%;
    animation: slide 32s infinite;
    will-change: transform;
    backface-visibility: hidden;
  }

  .slide {
    width: 100%;
    height: 100%;
    flex-shrink: 0;
    background-color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .slide img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }

  @keyframes slide {
    0% { transform: translateX(0); }
    20% { transform: translateX(0); }
    25% { transform: translateX(-100%); }
    45% { transform: translateX(-100%); }
    50% { transform: translateX(-200%); }
    70% { transform: translateX(-200%); }
    75% { transform: translateX(-300%); }
    95% { transform: translateX(-300%); }
    100% { transform: translateX(0); }
  }

  /* Навигационные точки */
  .navigation {
    position: absolute;
    width: 100%;
    bottom: 15px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .bar {
    width: 12px;
    height: 12px;
    border: 2px solid #fff;
    border-radius: 50%;
    cursor: pointer;
    transition: 0.3s;
  }

  .bar:hover {
    background: #fff;
  }

  @media (max-width: 600px) {
    .slider {
      height: auto;
      aspect-ratio: 2 / 3;
      max-width: 100%;
    }

    .slide img {
      width: 100%;
      height: auto;
      object-fit: contain;
    }
  }
</style>
</head>

<body>
  <h1>Предстоящие новинки</h1>

  <div class="slider">
    <div class="slides">
      <div class="slide">
        <img src="img/мстители.jpg" alt="Слайд 1">
      </div>
      <div class="slide">
        <img src="img/аватар.jpg" alt="Слайд 2">
      </div>
      <div class="slide">
        <img src="img/чекпуk.jpg" alt="Слайд 3">
      </div>
      <div class="slide">
        <img src="img/шрек.jpg" alt="Слайд 4">
      </div>
    </div>

    <div class="navigation">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>
</body>
</html>
