<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация и слайдер</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background-color: #000;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  h2 {
    text-align: center;
  }

  form {
    background: rgba(255, 255, 255, 0.05);
    padding: 20px;
    border-radius: 10px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 30px;
  }

  label {
    display: block;
    text-align: left;
    margin-top: 10px;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 10px;
    border-radius: 5px;
    border: none;
    margin-top: 5px;
    font-size: 16px;
  }

  input[type="submit"] {
    background: #444;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    width: 100%;
    margin-top: 15px;
  }

  input[type="submit"]:hover {
    background: #666;
  }

  .slider {
    width: 100%;
    max-width: 600px;
    height: 300px;
    border-radius: 15px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    margin-bottom: 30px;
  }

  .slides {
    display: flex;
    width: 400%;
    height: 100%;
    animation: slide 32s infinite;
  }

  .slide {
    width: 100%;
    flex-shrink: 0;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background-color: #000;
  }

  @keyframes slide {
    0% { transform: translateX(0); }
    20% { transform: translateX(0); }
    25% { transform: translateX(-100%); }
    45% { transform: translateX(-100%); }
    50% { transform: translateX(-200%); }
    70% { transform: translateX(-200%); }
    75% { transform: translateX(-300%); }
    95% { transform: translateX(-300%); }
    100% { transform: translateX(0); }
  }

  .navigation {
    position: absolute;
    width: 100%;
    bottom: 15px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .bar {
    width: 12px;
    height: 12px;
    border: 2px solid #fff;
    border-radius: 50%;
    cursor: pointer;
    transition: 0.5s;
  }

  .bar:hover {
    background: #fff;
  }

  @media (max-width: 600px) {
    form {
      width: 100%;
      padding: 15px;
    }

    .slider {
      height: 200px;
      max-width: 100%;
    }

    .slide img {
      height: 200px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="submit"] {
      font-size: 15px;
    }
  }
</style>
</head>

<body>
  <h2>Регистрация</h2>

  <form action="/submit" method="post">
    <label for="username">Имя:</label>
    <input type="text" id="username" name="username" required>

    <label for="email">Электронная почта:</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Пароль:</label>
    <input type="password" id="password" name="password" required>

    <label for="confirm_password">Подтвердите пароль:</label>
    <input type="password" id="confirm_password" name="confirm_password" required>

    <input type="submit" value="Зарегистрироваться">
  </form>

<h1 aling = "center">Предстоящие новинки</h1>
  <div class="slider">
    <div class="slides">
      <div class="slide">
        <img src="011.JPG" alt="Слайд 1">
      </div>
      <div class="slide">
        <img src="022.JPG" alt="Слайд 2">
      </div>
      <div class="slide">
        <img src="033.JPG" alt="Слайд 3">
      </div>
      <div class="slide">
        <img src="044.JPG" alt="Слайд 4">
      </div>
    </div>

    <div class="navigation">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>
</body>
</html>
