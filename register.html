<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация и слайдер</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    background: #000;
    color: white;
    font-family: sans-serif;
  }

  .container {
    width: 90%;
    max-width: 500px;
    margin: 30px auto;
  }

  h1, h2 {
    text-align: center;
  }

  form {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 30px;
  }

  label {
    display: block;
    margin-top: 10px;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 10px;
    border-radius: 5px;
    border: none;
    margin: 8px 0;
    font-size: 16px;
  }

  input[type="submit"] {
    background: #444;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    width: 100%;
  }

  input[type="submit"]:hover {
    background: #666;
  }

  .slider {
    position: relative;
    width: 100%;
    max-width: 600px;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    margin: 20px auto;
  }

  .slides {
    display: flex;
    width: 400%;
    height: 100%;
    transition: transform 0.5s ease-in-out;
  }

  .slides img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }

  input[type="radio"] {
    display: none;
  }

  #s1:checked ~ .slides { transform: translateX(0); }
  #s2:checked ~ .slides { transform: translateX(-100%); }
  #s3:checked ~ .slides { transform: translateX(-200%); }
  #s4:checked ~ .slides { transform: translateX(-300%); }

  .nav {
    position: absolute;
    width: 100%;
    bottom: 10px;
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  .nav label {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
    cursor: pointer;
    transition: 0.3s;
  }

  .nav label:hover {
    background: rgba(255,255,255,1);
  }

  #s1:checked ~ .nav label[for="s1"],
  #s2:checked ~ .nav label[for="s2"],
  #s3:checked ~ .nav label[for="s3"],
  #s4:checked ~ .nav label[for="s4"] {
    background: #333;
  }

  @media (max-width: 600px) {
    body {
      font-size: 14px;
    }

    .container {
      width: 95%;
      margin: 20px auto;
    }

    .slider {
      width: 100%;
      aspect-ratio: 9 / 16;
    }

    input[type="submit"] {
      font-size: 15px;
      padding: 12px;
    }
  }
</style>
</head>

<body>
  <div class="container">
    <h2>Регистрация</h2>

    <form action="/submit" method="post">
      <label for="username">Имя:</label>
      <input type="text" id="username" name="username" required>

      <label for="email">Электронная почта:</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Пароль:</label>
      <input type="password" id="password" name="password" required>

      <label for="confirm_password">Подтвердите пароль:</label>
      <input type="password" id="confirm_password" name="confirm_password" required>

      <input type="submit" value="Зарегистрироваться">
    </form>

    <h1>Предстоящие новинки</h1>

    <div class="slider">
      <input type="radio" name="switch" id="s1" checked>
      <input type="radio" name="switch" id="s2">
      <input type="radio" name="switch" id="s3">
      <input type="radio" name="switch" id="s4">

      <div class="slides">
        <img src="img/достать ножи.jpg" alt="Фото 1">
        <img src="img/мстители.jpg" alt="Фото 2">
        <img src="img/чекпук.jpg" alt="Фото 3">
        <img src="img/шрек.jpg" alt="Фото 4">
      </div>

      <div class="nav">
        <label for="s1"></label>
        <label for="s2"></label>
        <label for="s3"></label>
        <label for="s4"></label>
      </div>
    </div>
  </div>
</body>
</html>
