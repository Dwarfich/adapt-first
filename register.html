<doctype html>
<html>
<head><style>
    body {
      color: white;
    }

      * {
    box-sizing: border-box;
  }

{
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .slider {
    width: 600px;
    height: 350px;
    border-radius: 15px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .slides {
    display: flex;
    width: 400%;
    height: 100%;
    animation: slide 32s infinite;
  }

  .slide {
    width: 100%;
    flex-shrink: 0;
  }

  .slide img {
    width: 100%;
    height: 350px;
    object-fit:contain;
  }

  @keyframes slide {
    0% { transform: translateX(0); }
    20% { transform: translateX(0); }
    25% { transform: translateX(-100%); }
    45% { transform: translateX(-100%); }
    50% { transform: translateX(-200%); }
    70% { transform: translateX(-200%); }
    75% { transform: translateX(-300%); }
    95% { transform: translateX(-300%); }
    100% { transform: translateX(0); }
  }

  .navigation {
    position: absolute;
    width: 100%;
    bottom: 15px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .bar {
    width: 12px;
    height: 12px;
    border: 2px solid #fff;
    border-radius: 50%;
    cursor: pointer;
    transition: 0.5s;
  }

  .bar:hover {
    background: #fff;
  }
  </style> 

</head>

<body bgcolor="#000000" align="center">
    <h2>Регистрация</h2>

    <form action="/submit" method="post">
        <label for="username">Имя:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="email">Электронная почта:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Пароль:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <label for="confirm_password">Подтвердите пароль:</label><br>
        <input type="password" id="confirm_password" name="confirm_password" required><br><br>

        <input type="submit" value="Зарегистрироваться">
    </form>
    
<h1>Предстоящие новинки</h1>
    <div class="slider">
  <div class="slides">
    <div class="slide">
      <img src="011.JPG" alt="Слайд 1">
    </div>
    <div class="slide">
      <img src="022.JPG" alt="Слайд 2">
    </div>
    <div class="slide">
      <img src="033.JPG" alt="Слайд 3">
    </div>
    <div class="slide">
      <img src="044.JPG" alt="Слайд 4">
    </div>
  </div>

  <div class="navigation">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
</div>

</body>
</html>
