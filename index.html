<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINOwebBYdwarf</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background-color: #444;
      overflow-x: hidden;
    }

header {
  background-image: url("img/шапка.PNG");
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  height: 150px;
}



    nav {
  background: rgba(0, 0, 0, 0.7);
  color: white;
  padding: 10px;
  text-align: center;
  position: relative;
}

header {
  border-bottom: 3px solid rgba(0,0,0,0.6);
}
    nav a {
      color: #00aaff;
      text-decoration: none;
      margin: 0 10px;
    }

    nav a:hover {
      text-decoration: underline;
    }
    
    .menu-btn {
  background: #8b00ff;
  color: white;
  border: 2px solid #c45bff;
  padding: 10px 20px;
  font-size: 18px;
  cursor: pointer;
  border-radius: 10px;
  text-shadow: 0 0 5px #ffb3ff, 0 0 10px #ffb3ff;
  box-shadow: 
      0 0 5px #b300ff,
      0 0 10px #b300ff,
      0 0 20px #b300ff,
      0 0 40px #7a00cc;
  transition: 0.2s ease;
}

.menu-btn:hover {
  box-shadow: 
      0 0 10px #d580ff,
      0 0 20px #d580ff,
      0 0 40px #d580ff,
      0 0 80px #b300ff;
  transform: scale(1.07);
  background: #a100ff;
}
    .layout {
      display: flex;
      height: calc(100% - 100px);
      position: relative;
    }

    aside {
      background-color: rgba(255, 250, 240, 0.95);
      width: 200px;
      padding: 15px;
      border-right: 1px solid #ccc;
      position: fixed;
      top: 0;
      left: -220px;
      height: 100%;
      transition: left 0.3s ease;
      box-shadow: 2px 0 5px rgba(0,0,0,0.3);
      z-index: 100;
    }

    aside.active {
      left: 0;
    }

    aside a {
      display: block;
      margin-bottom: 12px;
      color: #007BFF;
      text-decoration: none;
      font-weight: 500;
    }

    aside a:hover {
      text-decoration: underline;
    }

    .main {
      flex: 1;
      margin-left: 0;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      background-color: #FFFAF0;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      color: #333;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      z-index: 50;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    @media (max-width: 900px) {
      nav {
        font-size: 14px;
      }
      .menu-btn {
        font-size: 14px;
        padding: 6px 10px;
      }
    }
  </style>
</head>
<body>
  <header>DwarfFilm</header>

  <nav>
    Источник: 
    <a href="https://www.kinopoisk.ru/lists/movies/top250/?utm_referrer=www.google.com" target="_blank" rel="noopener noreferrer">kinopoisk</a>
    <button class="menu-btn" onclick="toggleMenu()">☰ Меню</button>
  </nav>

  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <div class="layout">
    <aside id="sidebar">
      <a href="list.html" target="docframe">Список фильмов</a>
      <a href="test.html" target="docframe">Опрос</a>
      <a href="register.html" target="docframe">Войти</a>
      <a href="poster.html" target="docframe">Фильтры по жанрам</a>
      <a href="NEWS.html" target="docframe">Новости</a>
    </aside>

    <div class="main">
      <iframe name="docframe" src="register.html"></iframe>
    </div>
  </div>

  <footer>
    По вопросам: <a href="mailto:andron.16.07@mail.ru">andron.16.07@mail.ru</a>
  </footer>

  <script>
    function toggleMenu() {
      document.getElementById('sidebar').classList.toggle('active');
      document.getElementById('overlay').classList.toggle('active');
    }
  </script>
</body>
</html>
