<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINOwebBYdwarf</title>

  <style>
  *, *::before, *::after {
    box-sizing: border-box;
  }

  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: sans-serif;
    background-color: #444;
    overflow: hidden;
  }

  header {
    background-image: url("img/шапкаготовая.PNG");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 3px solid rgba(0,0,0,0.6);
    text-align: center;
    color: white;
    font-size: 2em;
    padding: 20px;
  }

  nav {
    background: rgba(0, 0, 0, 0.7);
    color: white;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 300;
    overflow: visible;
  }

  nav a {
    color: #00aaff;
    text-decoration: none;
    margin: 0 10px;
  }

  nav a:hover {
    text-decoration: underline;
  }

  .menu-btn {
    background: #8b00ff;
    color: white;
    border: 2px solid #c45bff;
    padding: 12px 26px;
    font-size: 22px;
    cursor: pointer;
    border-radius: 12px;
    text-shadow: 0 0 5px #ffb3ff, 0 0 10px #ffb3ff;
    box-shadow: 
        0 0 6px #b300ff,
        0 0 12px #b300ff,
        0 0 24px #b300ff,
        0 0 48px #7a00cc;
    transition: 0.2s ease;

    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-60%);
  }

  .menu-btn:hover {
    box-shadow: 
        0 0 10px #d580ff,
        0 0 20px #d580ff,
        0 0 40px #d580ff,
        0 0 80px #b300ff;
    transform: translateY(-60%) scale(1.07);
    background: #a100ff;
  }

  aside {
    background-color: rgba(0, 0, 0, 0.85);
    color: white;
    width: 200px;
    padding: 15px;
    border-right: 1px solid #333;

    position: fixed;
    top: calc(50px);
    left: -220px; 
    height: calc(100vh - 50px); 

    transition: left 0.3s ease;
    box-shadow: 2px 0 5px rgba(0,0,0,0.3);
    z-index: 250;
  }

  aside.active {
    left: 0;
  }

  aside a {
    display: block;
    margin-bottom: 12px;
    color: #007BFF;
    text-decoration: none;
    font-weight: 500;
  }

  .main {
    margin-left: 0;
    height: calc(100vh - 140px);
    overflow-y: auto;
    margin-top: 0;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .overlay {
    position: fixed;
    top: 50px;
    left: 0;
    width: 100%;
    height: calc(100% - 50px);
    background: rgba(0, 0, 0, 0.5);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease;
    z-index: 200;
  }

  .overlay.active {
    opacity: 1;
    visibility: visible;
  }

  @media (max-width: 900px) {
    nav {
      font-size: 14px;
    }
    .menu-btn {
      font-size: 16px;
      padding: 10px 16px;
    }
  }

  @media (max-width: 600px) {
    header {
      font-size: 1.3em;
      min-height: 80px;
    }
  }
  </style>

</head>
<body>

  <header>DwarfFilm</header>

  <nav>
    Источник:
    <a href="https://www.kinopoisk.ru/lists/movies/top250/" target="_blank" rel="noopener noreferrer">
      kinopoisk
    </a>

    <button class="menu-btn" onclick="toggleMenu()">☰ Меню</button>
  </nav>

  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <aside id="sidebar">
    <a href="list.html" target="docframe">Список фильмов</a>
    <a href="test.html" target="docframe">Опрос</a>
    <a href="register.html" target="docframe">Войти</a>
    <a href="poster.html" target="docframe">Фильтры по жанрам</a>
    <a href="NEWS.html" target="docframe">Новости</a>
  </aside>

  <div class="main">
    <iframe name="docframe" src="NEWS.html"></iframe>
  </div>

  <script>
    function toggleMenu() {
      document.getElementById('sidebar').classList.toggle('active');
      document.getElementById('overlay').classList.toggle('active');
    }
  </script>

</body>
</html>
