<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap 5 Vertical Carousel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #carouselExampleIndicators {
      max-width: 400px;
      aspect-ratio: 2 / 3;
      margin: 20px auto;
      position: relative;
      border: 1px solid #ccc;
    }

    #carouselExampleIndicators .carousel-inner,
    #carouselExampleIndicators .carousel-item {
      height: 100%;
    }

    #carouselExampleIndicators .carousel-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #f0f0f0;
    }

    #carouselExampleIndicators .carousel-control-prev,
    #carouselExampleIndicators .carousel-control-next {
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
    }

    #carouselExampleIndicators .carousel-control-prev-icon,
    #carouselExampleIndicators .carousel-control-next-icon {
      background-size: 100% 100%;
    }
    .glowing {
  color: orange;
  text-shadow: 
    0 0 5px orange,
    0 0 10px orange,
    0 0 20px orange,
    0 0 40px darkorange;
}
  </style>
</head>
<body style="background-color: #000000; color: #ffffff;">
  <h1 class="text-center glowing">Грядущие новинки</h1>

  <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="3" aria-label="Slide 4"></button>
    </div>
<div class="carousel-inner">
  <div class="carousel-item active">
    <img class="d-block w-100" src="img/чекпуk.jpg" alt="First slide">
  </div>
  <div class="carousel-item">
    <img class="d-block w-100" src="img/шрек.jpg" alt="Second slide">
  </div>
  <div class="carousel-item">
    <img class="d-block w-100" src="img/мстители.jpg" alt="Third slide">
  </div>
  <div class="carousel-item">
    <img class="d-block w-100" src="img/достать ножи.jpg" alt="Fourth slide">
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
